[project]
name = "agent"
version = "0.1.0"
description = "Vrixel workflow agent template: a durable LangGraph agent with human approval, MCP tools and models through the product's LLM gateway."
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.2,<4",
  "psycopg[binary,pool]>=3.3.6",
  "anthropic>=2.4,<3",
  "mcp>=2.3,<3",
  "fastapi>=0.162,<1",
  "uvicorn[standard]>=0.54,<1",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "pyjwt[crypto]>=2.15.1,<3",
  "prometheus-client>=0.26,<1",
  "openfeature-sdk>=0.10,<1",
  "openfeature-provider-ofrep>=0.3,<1",
  "confluent-kafka>=2.16,<3",
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
  "opentelemetry-instrumentation-fastapi>=0.66b2",
  "opentelemetry-instrumentation-httpx>=0.66b2",
  "opentelemetry-instrumentation-requests>=0.66b2",
  "opentelemetry-instrumentation-psycopg>=0.66b2",
  "sentry-sdk>=2.72,<3",
]

[project.scripts]
agent = "agent.api:main"

[dependency-groups]
dev = ["pytest>=9.2", "pytest-cov>=7.1", "ruff>=0.17", "mypy>=2.4"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".github"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"evals/*" = ["S105", "S106"]

[tool.mypy]
strict = true
packages = ["agent"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["evals: agent evaluations (run in the evals job)"]
addopts = "-q --cov=agent --cov-report=term --cov-report=xml --junitxml=reports/junit.xml"

[tool.coverage.report]
fail_under = 90
